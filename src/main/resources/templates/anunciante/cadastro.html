<!DOCTYPE html>
<html layout:decorate="~{layout}">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <section class="layout-content" layout:fragment="corpo">
      <nav class="navbar navbar-expand-md bg-light">
        <div class="collapse navbar-collapse" id="navbarsExampleDefault">
          <ul class="navbar-nav mr-auto">
            <li class="nav-item active">
              <i class="oi oi-caret-right"></i>
              <span th:text="#{anunciante.cadastrar.label}"></span>
            </li>
          </ul>
          <a
            class="btn btn-primary btn-md"
            th:href="@{/anunciantes/lista}"
            role="button"
          >
            <span
              class="oi oi-spreadsheet"
              title="Listar"
              aria-hidden="true"
            ></span>
            <span th:text="#{anunciante.listar.label}"></span>
          </a>
        </div>
      </nav>

      <div class="container" id="cadastro">
        <div th:replace="~{fragments/alert}"></div>
        <form
          th:action="@{/anunciantes/salvar}"
          th:object="${anunciante}"
          method="POST"
        >
          <div class="form-row">
            <div class="form-group col-md-6">
              <label>Nome:</label>
              <input type="text" class="form-control" th:field="*{nome}" />
            </div>
            <div class="form-group col-md-6">
              <label>Email:</label>
              <input type="email" class="form-control" th:field="*{email}" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group col-md-4">
              <label>Telefone:</label>
              <input type="text" class="form-control" th:field="*{telefone}" />
            </div>
            <div class="form-group col-md-4">
              <label>CPF:</label>
              <input type="text" class="form-control" th:field="*{cpf}" />
            </div>
            <div class="form-group col-md-4">
              <label>Tipo Pessoa:</label>
              <input
                type="text"
                class="form-control"
                th:field="*{tipoPessoa}"
              />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group col-md-8">
              <label>Endereço:</label>
              <input type="text" class="form-control" th:field="*{endereco}" />
            </div>
            <div class="form-group col-md-4">
              <label>Data Cadastro:</label>
              <input
                type="date"
                class="form-control"
                th:field="*{dataCadastro}"
              />
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-sm">Salvar</button>
        </form>
      </div>
    </section>
  </body>
</html>
