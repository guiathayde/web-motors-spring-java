<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Cadastro de Carro</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <h1>Cadastro de Carro</h1>
    <form th:action="@{/carros/salvar}" th:object="${carro}" method="post">
      <label>Marca:</label>
      <input type="text" th:field="*{marca}" /> <br />
      <label>Modelo:</label>
      <input type="text" th:field="*{modelo}" /> <br />
      <label>Ano:</label>
      <input type="number" th:field="*{ano}" /> <br />
      <label>Cor:</label>
      <input type="text" th:field="*{cor}" /> <br />
      <label>Preço:</label>
      <input type="number" step="0.01" th:field="*{preco}" /> <br />
      <label>Quilometragem:</label>
      <input type="number" th:field="*{quilometragem}" /> <br />
      <label>Câmbio:</label>
      <input type="text" th:field="*{cambio}" /> <br />
      <label>Combustível:</label>
      <input type="text" th:field="*{combustivel}" /> <br />
      <label>Placa:</label>
      <input type="text" th:field="*{placa}" /> <br />
      <label>Descrição:</label>
      <input type="text" th:field="*{descricao}" /> <br />
      <label>Anunciante:</label>
      <select th:field="*{anunciante}" required>
        <option
          th:each="anunciante : ${anunciantes}"
          th:value="${anunciante}"
          th:text="${anunciante.nome}"
        ></option>
      </select>
      <br />
      <button type="submit">Salvar</button>
    </form>
    <a th:href="@{/carros/lista}">Voltar</a>
  </body>
</html>
